plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.otdiary.app"
    compileSdk 34
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        // Keep the existing application ID so current app installs and
        // Firebase Android configuration remain associated with this app.
        applicationId "com.otdiary.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 2
        versionName "2.1.0"
    }

    buildTypes {
        release {
            // Keep debug signing for personal test APKs.
            // Configure a private release keystore before Play Store publishing.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}
