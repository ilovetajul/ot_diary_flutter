plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.otdiary.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        // Keep the existing application ID so current app installs and
        // Firebase Android configuration remain associated with this app.
        applicationId "com.otdiary.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 4
        versionName "2.2.1"
    }

    buildTypes {
        release {
            // Debug signing is retained only for test builds.
            // Production release signing must use the verified private keystore.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

flutter {
    source '../..'
}
