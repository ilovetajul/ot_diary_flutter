name: OT Diary 2.2.1 — Stability CI

on:
  push:
    branches:
      - feature/modern-ot-diary
      - feature/ot-diary-v2.2
      - fix/**
  pull_request:
    branches:
      - feature/modern-ot-diary
      - feature/ot-diary-v2.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ot-diary-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm Java version
        run: java -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # Required by the currently successful Flutter/Gradle toolchain:
      # make Maven Central available to Flutter's included Gradle build.
      - name: Configure Flutter Gradle plugin repositories
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          test -f "$SETTINGS_FILE"
          python3 - "$SETTINGS_FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          if "pluginManagement {" not in content:
              block = """pluginManagement {
              repositories {
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
          }

          """
              content = block + content
              path.write_text(content, encoding="utf-8")
          updated = path.read_text(encoding="utf-8")
          if "pluginManagement {" not in updated or "mavenCentral()" not in updated:
              raise SystemExit("Maven Central repository configuration is missing.")
          PY

      - name: Flutter and toolchain diagnostics
        run: |
          flutter --version
          flutter doctor --verbose

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "ndk;28.2.13676358"

      - name: Verify project identity and version
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/app/build.gradle
          grep -F 'applicationId "com.otdiary.app"' android/app/build.gradle
          grep -F 'versionName "2.2.1"' android/app/build.gradle
          grep -F 'version: 2.2.1+4' pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify launcher icon output
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Verify Android embedding
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("android/app/src/main/AndroidManifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          application = root.find("application")
          app_name = application.get(ns + "name") if application is not None else None
          versions = [
              node.get(ns + "value")
              for node in root.iter("meta-data")
              if node.get(ns + "name") == "flutterEmbedding"
          ]
          if app_name == "io.flutter.app.FlutterApplication" or "1" in versions or "2" not in versions:
              raise SystemExit("Android v1 embedding detected.")
          PY

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OT-Diary-2.2.1-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release-mode APK
        run: flutter build apk --release

      - name: Report signing limitation
        run: |
          echo "::warning::Current release signing is debug signing. Production signing remains BLOCKED until the existing keystore and matching certificate are verified."

      - name: Upload release-mode APK (debug-signed)
        uses: actions/upload-artifact@v4
        with:
          name: OT-Diary-2.2.1-release-mode-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
