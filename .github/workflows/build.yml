name: OT Diary — Safe APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Verify existing Android project and application ID
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/app/build.gradle
          ! grep -R -E 'rm -rf android|flutter create' .github/workflows
          grep -F 'applicationId "com.otdiary.app"' android/app/build.gradle
          grep -F 'versionName "2.2.1"' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OT-Diary-2.2.1-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release-mode APK
        run: flutter build apk --release

      - name: Report signing limitation
        run: |
          echo "::warning::Release build currently uses the repository's debug signing configuration. This artifact is for testing only, not production distribution."

      - name: Upload release-mode APK (debug-signed)
        uses: actions/upload-artifact@v4
        with:
          name: OT-Diary-2.2.1-release-mode-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
