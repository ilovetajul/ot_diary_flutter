name: OT Diary feature branch CI

on:
  push:
    branches:
      - feature/modern-ot-diary
      - feature/ot-diary-v2.2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply verified v2.2 source patch from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          PATCH_COMMIT="0adb9c42eb71d4876a77954decada6a3daffdcea"
          if git merge-base --is-ancestor "$PATCH_COMMIT" HEAD; then
            echo "Source patch already committed; preserve follow-up fixes."
            exit 0
          fi
          PATCH_ZIP="OT_Diary_v2_2_11_Features_Patch.zip"
          BASE_COMMIT="00eb7b708dbc48ca96efe9f5432bfd124d679013"
          test -f "$PATCH_ZIP"
          tmp="$(mktemp -d)"
          unzip -q "$PATCH_ZIP" -d "$tmp"
          test -f "$tmp/PATCH_README_BN.md"
          cat "$tmp/PATCH_README_BN.md"
          (cd "$tmp" && sha256sum -c FILES_SHA256.txt)

          # Only the 19 explicitly checksummed patch files are applied.
          file_count=0
          while read -r expected relative_path; do
            test -n "$relative_path"
            case "$relative_path" in
              CHANGELOG.md|android/app/build.gradle|android/app/src/main/AndroidManifest.xml|android/app/src/main/kotlin/com/otdiary/app/MainActivity.kt|android/app/src/main/kotlin/com/otdiary/app/OtSummaryWidget.kt|android/app/src/main/res/layout/ot_summary_widget.xml|android/app/src/main/res/xml/ot_summary_widget_info.xml|lib/app_theme.dart|lib/main.dart|lib/screens/auth_screen.dart|lib/screens/chart_screen.dart|lib/screens/extra_tools_screen.dart|lib/screens/home_screen.dart|lib/screens/settings_screen.dart|lib/screens/splash_screen.dart|lib/services/database_service.dart|lib/services/extra_tools.dart|pubspec.yaml|test/extra_tools_test.dart)
                install -D "$tmp/$relative_path" "$relative_path"
                file_count=$((file_count + 1))
                ;;
              *)
                echo "Unexpected patch path: $relative_path"
                exit 1
                ;;
            esac
          done < "$tmp/FILES_SHA256.txt"
          test "$file_count" -eq 19

          # Preserve the existing Android package/application ID.
          git show "$BASE_COMMIT:android/app/build.gradle" | grep -F 'applicationId "com.otdiary.app"'
          grep -F 'applicationId "com.otdiary.app"' android/app/build.gradle
          # Firebase configuration and database path files are not in the patch allowlist.

          git diff --check
          git add CHANGELOG.md android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/com/otdiary/app/MainActivity.kt android/app/src/main/kotlin/com/otdiary/app/OtSummaryWidget.kt android/app/src/main/res/layout/ot_summary_widget.xml android/app/src/main/res/xml/ot_summary_widget_info.xml lib/app_theme.dart lib/main.dart lib/screens/auth_screen.dart lib/screens/chart_screen.dart lib/screens/extra_tools_screen.dart lib/screens/home_screen.dart lib/screens/settings_screen.dart lib/screens/splash_screen.dart lib/services/database_service.dart lib/services/extra_tools.dart pubspec.yaml test/extra_tools_test.dart

          changed_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          test "$changed_count" -eq 19
          if git diff --cached --quiet; then
            echo "Patch files already applied; no source commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply OT Diary v2.2 11-feature patch"
            git push origin HEAD:refs/heads/feature/ot-diary-v2.2
          fi

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm Java version
        run: java -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # Flutter's Gradle plugin is an included build. Its own settings file
      # lacks pluginManagement repositories, so Kotlin DSL dependencies are
      # being searched only in Gradle Plugin Portal. Add Maven Central there.
      - name: Add Maven Central to Flutter Gradle plugin repositories
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          test -f "$SETTINGS_FILE"
          python3 - "$SETTINGS_FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")

          if "pluginManagement {" not in content:
              block = "pluginManagement {\\n    repositories {\\n        mavenCentral()\\n        google()\\n        gradlePluginPortal()\\n    }\\n}\\n\\n"
              content = block + content
              path.write_text(content, encoding="utf-8")

          updated = path.read_text(encoding="utf-8")
          if "pluginManagement {" not in updated or "mavenCentral()" not in updated:
              raise SystemExit("Could not configure Maven Central for Flutter's included Gradle build.")

          print(f"Updated Flutter SDK settings: {path}")
          print("\\n".join(updated.splitlines()[:18]))
          PY

      - name: Flutter version and selected JDK
        run: |
          flutter --version
          flutter doctor --verbose

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "ndk;28.2.13676358"

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Generate Android Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Verify launcher icon output
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Diagnose Android embedding manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          root = ET.parse(path).getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          application = root.find("application")
          app_name = application.get(ns + "name") if application is not None else None
          versions = [
              node.get(ns + "value")
              for node in root.iter("meta-data")
              if node.get(ns + "name") == "flutterEmbedding"
          ]
          print(f"Manifest: {path}")
          print(f"application android:name: {app_name}")
          print(f"flutterEmbedding values: {versions}")
          if app_name == "io.flutter.app.FlutterApplication" or "1" in versions or "2" not in versions:
              raise SystemExit("Manifest is still detected as Android v1 embedding.")
          PY
          echo "MainActivity:"
          cat android/app/src/main/kotlin/com/otdiary/app/MainActivity.kt

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OT-Diary-v2.2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
