name: Apply modern OT diary patch (one-time)
on:
  push:
    branches:
      - feature/modern-ot-diary
    paths:
      - .github/workflows/apply-modern-patch.yml
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: feature/modern-ot-diary
          fetch-depth: 0
      - name: Extract and apply patch files (no deletions)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          archive = Path("OT_Diary_Modern_Update_Patch.zip")
          if not archive.exists():
              raise SystemExit("Patch ZIP not found at repository root")
          with ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity error: {bad}")
              for entry in z.infolist():
                  name = entry.filename
                  if entry.is_dir() or name == ".github/workflows/build.yml":
                      continue
                  path = Path(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  target = Path(".") / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(entry) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
          PY
      - name: Commit applied source to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git restore --staged .github/workflows/build.yml || true
          git rm -f .github/workflows/apply-modern-patch.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Apply modern OT diary patch"
            git push origin HEAD:feature/modern-ot-diary
          fi
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
