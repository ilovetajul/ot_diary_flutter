name: ot_diary
description: OT Diary - আধুনিক ওভারটাইম ট্র্যাকার
publish_to: 'none'
version: 2.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - পুরোনো Authentication ও Realtime Database path অপরিবর্তিত
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_database: ^11.1.0
  firebase_storage: ^12.1.0

  # Local-first storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Profile photo
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # PDF
  pdf: ^3.11.0
  printing: ^5.13.0

  # UI
  fl_chart: ^0.68.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icon/

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#07111F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
